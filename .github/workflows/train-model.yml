name: Train with DVC and MLflow

on:
  push:
    branches: [train]

jobs:
  train:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull versioned dataset with DVC
        run: dvc pull

      - name: Train model and log to MLflow
        run: python src/train.py

      - name: Upload MLflow run data as artifact
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-run
          path: mlruns/
          retention-days: 7

      - name: Upload trained model as artifact
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: model.pkl
          retention-days: 7